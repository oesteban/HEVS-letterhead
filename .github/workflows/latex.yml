name: LaTeX

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fixture:
          - english-default
          - french-default
          - english-endorser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-xetex \
            latexmk \
            chktex

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Prepare letter data
        run: cp .github/test-fixtures/${{ matrix.fixture }}.yaml letter.yaml

      - name: Render, lint, and build PDF
        run: pixi run all

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: letterhead-${{ matrix.fixture }}
          path: letter.pdf

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download default PDF
        uses: actions/download-artifact@v4
        with:
          name: letterhead-english-default

      - name: Upload PDF to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" letter.pdf
